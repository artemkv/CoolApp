name: Build iOS Unsigned

# only manually
on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS app (Unsigned)
    runs-on: macos-26

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

        # Here I am completely skipping all the certificates part

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4.1" # latest-stable should work too

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x # aligned with my dev env

      - name: Install app dependencies
        run: npm install

      - name: Build project app
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      # `disableAutomaticPackageResolution` prevents packages from
      # automatically being resolved to versions other than those
      # recorded in the Package.resolved file. But I don't have Package.resolved file
      - name: Build Xcode Archive (Unsigned)
        run: |
          xcodebuild -project './ios/App/App.xcodeproj' \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -archivePath App.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            archive

      # this is what google AI said, and makes sense
      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: App.xcarchive
